<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar &middot; Loja de Informática</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="pagina-login">
  <main class="login">
    <h1 class="marca">Byte<span>Shop</span></h1>
    <p class="login__sub">Entre para acessar os produtos</p>

    <form id="form-login" class="painel" novalidate>
      <div class="campo">
        <label for="usuario">Usuário</label>
        <input type="text" id="usuario" name="usuario" autocomplete="username"
               autocapitalize="none" required autofocus>
      </div>

      <div class="campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" autocomplete="current-password" required>
      </div>

      <button type="submit" id="botao-login" class="botao">Entrar</button>

      <p id="mensagem-login" class="mensagem" role="status" hidden></p>
    </form>

    <div class="login__dicas">
      <strong>Contas de teste</strong>
      <ul>
        <li><code>admin</code> / <code>admin123</code> &mdash; pode cadastrar produtos</li>
        <li><code>cliente</code> / <code>cliente123</code> &mdash; somente consulta</li>
      </ul>
    </div>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
