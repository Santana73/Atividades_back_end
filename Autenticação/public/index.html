<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loja de Informática</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topo">
    <div class="container topo__conteudo">
      <h1 class="marca">Byte<span>Shop</span></h1>
      <p class="topo__sub">Loja de Informática &middot; gerenciamento de produtos</p>

      <div class="sessao">
        <span id="usuario-logado" class="sessao__usuario"></span>
        <button type="button" id="botao-sair" class="botao-sair">Sair</button>
      </div>
    </div>
  </header>

  <main class="container layout">
    <!-- LISTAGEM -->
    <section class="painel" aria-labelledby="titulo-lista">
      <div class="painel__cabecalho">
        <div>
          <h2 id="titulo-lista">Produtos</h2>
          <p class="contagem" id="contagem" aria-live="polite"></p>
        </div>

        <div class="filtro">
          <label for="filtro-categoria">Categoria</label>
          <select id="filtro-categoria">
            <option value="">Todas</option>
          </select>
        </div>
      </div>

      <p id="mensagem-lista" class="mensagem" role="status" hidden></p>

      <div id="lista-produtos" class="grade" aria-live="polite"></div>
    </section>

    <!-- FORMULÁRIO -->
    <aside class="painel painel--form" aria-labelledby="titulo-form">
      <h2 id="titulo-form">Novo produto</h2>

      <p id="aviso-permissao" class="mensagem mensagem--info" hidden>
        Somente administradores podem cadastrar produtos.
      </p>

      <form id="form-produto" novalidate>
        <div class="campo">
          <label for="nome">Nome</label>
          <input type="text" id="nome" name="nome" placeholder="Ex.: Headset HyperX Cloud" required>
        </div>

        <div class="campo">
          <label for="categoria">Categoria</label>
          <input type="text" id="categoria" name="categoria" list="categorias-sugeridas"
                 placeholder="Ex.: Periféricos" required>
          <datalist id="categorias-sugeridas"></datalist>
        </div>

        <div class="campo-duplo">
          <div class="campo">
            <label for="preco">Preço (R$)</label>
            <input type="number" id="preco" name="preco" min="0.01" step="0.01"
                   inputmode="decimal" placeholder="0,00" required>
          </div>

          <div class="campo">
            <label for="estoque">Estoque</label>
            <input type="number" id="estoque" name="estoque" min="0" step="1"
                   inputmode="numeric" placeholder="0" required>
          </div>
        </div>

        <button type="submit" id="botao-cadastrar" class="botao">Cadastrar produto</button>

        <p id="mensagem-form" class="mensagem" role="status" hidden></p>
      </form>
    </aside>
  </main>

  <footer class="rodape">
    <div class="container">Projeto de front-end integrado à API Node/Express.</div>
  </footer>

  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
